<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ThreadZero</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-page">

    <header class="login-header">
        <a href="index.html" class="login-logo">ThreadZero</a>
        <a href="index.html" class="back-home">Back to Home</a>
    </header>

    <main class="login-container">

        <div class="login-card">

            <h1>Welcome Back</h1>
            <p class="login-subtitle">
                Log in to join the conversation.
            </p>

            <!-- Username and Password Login -->
            <section class="login-section">

                <h2>Username Login</h2>

                <form method="POST">

                    <input type="hidden" name="action" value="login">

                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        minlength="3"
                        maxlength="20"
                        autocomplete="username"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="8"
                        maxlength="255"
                        autocomplete="current-password"
                        required
                    >

                    <button type="submit" class="login-button">
                        Log In
                    </button>

                </form>

            </section>

            <!-- 16-Digit Token Login -->
            <section class="login-section token-section">

                <h2>Token Login</h2>

                <p>
                    Log in using your 16-digit ThreadZero token.
                </p>

                <form method="POST">

                    <input type="hidden" name="action" value="token_login">

                    <label for="token">16-Digit Token</label>

                    <input
                        type="text"
                        id="token"
                        name="token"
                        placeholder="4829-1049-8372-6154"
                        inputmode="text"
                        maxlength="19"
                        autocomplete="one-time-code"
                        title="Enter your 16-digit token, with or without hyphens"
                        required
                    >

                    <button type="submit" class="login-button">
                        Login with Token
                    </button>

                </form>

            </section>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </div>

    </main>

    <footer class="login-footer">
        <p>&copy; 2026 ThreadZero. All rights reserved.</p>
    </footer>

</body>
</html>
