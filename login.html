<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ThreadZero</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="login-page">

    <header class="login-header">
        <a href="index.html" class="login-logo">ThreadZero</a>
        <a href="index.html" class="back-home">Back to Home</a>
    </header>

    <main class="login-container">

        <div class="login-card">
            <h1>Welcome Back</h1>
            <p class="login-subtitle">Log in to join the conversation.</p>

            <form>
                <label for="username">Username or Email</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username or email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="login-button">Log In</button>
            </form>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>
        </div>

    </main>

    <footer class="login-footer">
        <p>&copy; 2026 ThreadZero. All rights reserved.</p>
    </footer>

</body>
</html>
