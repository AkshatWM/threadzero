<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - ThreadZero</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="profile-page">

    <header class="profile-header">
        <h2>ThreadZero</h2>
        <a href="index.html">Home</a>
    </header>

    <main class="profile-box">

        <h1>User Profile</h1>

        <div class="user-info">
            <h2>Anonymous User</h2>
            <p>Member of ThreadZero</p>
            <p>Joined: November 2026</p>
        </div>

        <hr>

        <!-- Editable About Me Section -->
        <section class="about-section">

            <h2>About Me</h2>

            <form method="POST">

                <label for="bio">Update your biography:</label>

                <textarea
                    id="bio"
                    name="bio"
                    rows="5"
                    placeholder="Write something about yourself..."
                    required
                >I enjoy sharing ideas and discussing different topics with the community.</textarea>

                <button type="submit" class="profile-button">
                    Update Bio
                </button>

            </form>

        </section>

        <hr>

        <!-- My Posts Section -->
        <section class="my-posts">

            <h2>My Posts</h2>

            <div class="profile-post">
                <h3>Is Artificial Intelligence helpful?</h3>
                <p>Board: Technology</p>
                <a href="thread.html">View Discussion</a>
            </div>

            <div class="profile-post">
                <h3>How can students improve learning?</h3>
                <p>Board: General</p>
                <a href="thread.html">View Discussion</a>
            </div>

        </section>

    </main>

    <footer class="profile-footer">
        © 2026 ThreadZero
    </footer>

</body>
</html>
